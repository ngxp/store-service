<nss-new-book></nss-new-book>

@for (book of (books$ | async); track book; let i = $index) {
  <div>
    <nss-book-list-entry [book]="book" [routerLink]="i.toString()"></nss-book-list-entry>
  </div>
}

@if (!loaded) {
  <span class="not-loaded">
    Books are loading
  </span>
}
@if (loaded) {
  <span class="loaded">
    All books loaded
  </span>
}
@if (books$ | async) {
  <span class="total">
    {{ (books$ | async).length }} books total
  </span>
}
